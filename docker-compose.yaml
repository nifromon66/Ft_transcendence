services:
  db:
    image: postgres:16
    env_file:
      - .envs/.env.db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_db_network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend
      dockerfile: ../../docker/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .envs/.env.db
      - .envs/.env.backend
    networks:
      - backend_db_network
      - nginx_backend_network

    volumes:
      - ./src/backend:/app
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./src/frontend
      dockerfile: ../../docker/frontend/Dockerfile
    networks:
      - nginx_frontend_network
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  nginx:
    build:
      context: ./src/nginx
      dockerfile: ../../docker/nginx/Dockerfile
    env_file:
      - .envs/.env.nginx
    networks:
      - nginx_frontend_network
      - nginx_backend_network

    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  db_data:

networks:
  backend_db_network:
  nginx_frontend_network:
  nginx_backend_network:
